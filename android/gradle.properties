# A memória do daemon.
#
# 3g é o mesmo do `clients/gradle.properties`, e o número não é aleatório: o
# build roda dentro de um container que divide a máquina com o Postgres, a API
# em Rust, o Vite e mais trinta containers (medido: 40 de pé em 04/08/2026).
# Um daemon que pede metade da RAM faz o `odeon-api` morrer por OOM no meio de
# uma identificação — e a identificação leva ~1h.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true

# O R não-transitivo: cada módulo enxerga só os próprios recursos, e não os das
# dependências. É o padrão desde o AGP 8 e está escrito aqui porque é o tipo de
# coisa que alguém desliga pra fazer um import errado compilar.
android.nonTransitiveRClass=true

kotlin.code.style=official
