## O catálogo de versões do app Android.
##
## Todas as versões abaixo foram **medidas** nos repositórios (Google Maven e
## Maven Central) em 04/08/2026, não lembradas. Ver o `README.md` ao lado pro
## comando que remede.
##
## ## Por que ele não é o catálogo do `clients/`
##
## O `clients/gradle/libs.versions.toml` está pinado em AGP 8.7.3 e Kotlin
## 2.0.21, e o comentário dele diz o motivo: «Kotlin 2.0.21 é o que casa com
## Compose Multiplatform 1.7.1». Este app **não usa Compose Multiplatform** — ele
## usa o Compose de Android. A restrição não o alcança, e herdá-la seria nascer
## dois majors de AGP atrás por causa de um problema que não é dele.

[versions]
# ---------------------------------------------------------------- ferramentas
#
# AGP 9 mudou coisas que quebram receita antiga: `kotlinOptions` saiu (virou
# `compilerOptions` do plugin de Kotlin) e vários `buildFeatures` deixaram de
# vir ligados. Está anotado aqui porque é o que faz um exemplo de internet de
# 2024 não colar neste arquivo.
agp = "9.3.1"
kotlin = "2.4.10"

# ------------------------------------------------------------------ o alvo
#
# `minSdk` 26 é **decidido** na espec (§4), e o motivo está lá: é onde mora o
# Picture-in-Picture, que num app de vídeo não é enfeite. Adaptive icon e canal
# de notificação também são de 26.
#
# `compileSdk` 37 com menor 1 — ou seja, a plataforma **37.1**.
#
# ## O número mudou depois de o build reclamar, e o motivo vale registrar
#
# A primeira medição deste arquivo dizia 36, e estava errada: o Android passou a
# ter **versões menores** de plataforma (36.1, 37.0, 37.1, 37.2-beta), e um
# levantamento que só procurava `android-<inteiro>` não enxerga nenhuma delas.
#
# Quem denunciou foi o próprio build: `androidx.core:core:1.19.0`,
# `core-ktx:1.19.0` e `lifecycle-runtime-compose:2.11.0` recusam compilar contra
# menos que 37. Ou seja, com 36 este app não teria AndroidX — e o erro só
# aparece no `checkDebugAarMetadata`, nunca no catálogo.
#
# `minSdk` 26 é **decidido** na espec (§4), e o motivo está lá: é onde mora o
# Picture-in-Picture, que num app de vídeo não é enfeite. Adaptive icon e canal
# de notificação também são de 26. Ele não mudou.
compileSdk = "37"
compileSdkMinor = "1"
minSdk = "26"
targetSdk = "37"

# O build-tools que o AGP 9.3.1 pede pra plataforma 37. Está pinado aqui porque
# senão o AGP baixa o que quiser no primeiro build — e "o que quiser" muda com o
# tempo, o que é o oposto de um build reprodutível.
buildTools = "37.0.0"

# ------------------------------------------------------------------ AndroidX
composeBom = "2026.06.01"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
datastore = "1.2.1"

# --------------------------------------------------------------------- rede
#
# ## OkHttp é a peça central, e a escolha foi pela fase 2
#
# O Retrofit desenha o contrato da API; quem fala na rede é o OkHttp debaixo
# dele. E o `media3-datasource-okhttp` aceita **a mesma instância** — um pool de
# conexões, um cache, um interceptor pondo o `Authorization`.
#
# Com dois clientes HTTP, o player abre conexão própria e o token vira uma
# segunda contabilidade, que é exatamente onde o §43 morde: emitir um token de
# mídia novo aposenta o anterior, e o anterior é o que está dentro do player.
retrofit = "3.0.0"
okhttp = "5.4.0"
serialization = "1.11.0"

# Carrega os pôsteres servidos em `/artwork/`. `coil-network-okhttp` porque ele
# também aceita a instância compartilhada — é a terceira coisa a usar a mesma.
coil = "3.5.0"

# ------------------------------------------------------------------- Media3
#
# Declarado aqui, **ainda não ligado** no `app/build.gradle.kts` — a fase 0 não
# tem player. Está no catálogo porque a decisão que o acompanha precisa estar
# escrita antes da primeira linha dele, e este é o lugar onde quem for buscar a
# dependência vai passar:
#
#   ⚠️ A UI do player se escreve contra a interface `Player`, NUNCA contra
#      `ExoPlayer`.
#
# O `media3-cast` entrega um `CastPlayer` que implementa a **mesma** interface.
# Escrito assim, mandar pra TV (fase 4) é trocar a instância — a timeline, o
# selo do modo, os gestos e o preview de seek continuam funcionando sem saber
# que mudou de aparelho. Escrito contra `ExoPlayer`, cada tela que toca o player
# vira reescrita. Espec §4c.
media3 = "1.10.1"

# O SDK do Cast do Google. Ver o comentário em `play-services-cast-framework`.
playServicesCast = "22.1.0"

# ------------------------------------------------------------------- widget
#
# O Glance — o widget de "continuar assistindo" da R9.
#
# 1.1.1 é a última **estável**; a linha 1.2 inteira está em beta/rc e a 1.3 em
# alpha. Num app que não tem widget nenhum hoje, estrear com alpha seria pagar
# por API que ainda muda de assinatura.
#
# ## Ele não é o Compose desta tela, e isso importa
#
# Um widget não roda no processo do app: ele é desenhado pelo launcher, a partir
# de `RemoteViews`. O Glance dá a **sintaxe** do Compose e gera `RemoteViews` por
# baixo — o que significa que nada de `ui/` reaproveita: nem `Cores`, nem
# `Tipo`, nem um `Modifier`. São `GlanceModifier`, `ColorProvider` e uma lista
# curta de composables que o `RemoteViews` sabe representar.
glance = "1.1.1"

# --------------------------------------------------------------------- teste
junit = "4.13.2"
androidxTestJunit = "1.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# É onde mora o `collectAsStateWithLifecycle`, e ele não é detalhe: o
# `collectAsState` puro continua coletando com o app em segundo plano. Num app
# que vai manter uma conexão SSE aberta (§62), coletar de tela apagada é
# trabalho e bateria por nada.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# O BOM alinha as versões de todo artefato do Compose entre si. Com ele, as
# linhas de `compose-*` abaixo vão sem versão de propósito — duas versões de
# Compose no mesmo APK é como um `NoSuchMethodError` em tempo de execução nasce.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# A barra de navegação que muda de forma conforme a tela.
#
# ## Por que um artefato, e não 40 linhas à mão
#
# Este projeto recusou o `navigation-compose` com argumento medido — a pilha tem
# dois níveis e um `sealed` resolve. A régua é a mesma aqui, e dá resposta
# oposta: o `NavigationSuiteScaffold` não guarda estado nenhum, ele entrega as
# **duas formas** (barra inferior e trilho lateral) e a troca entre elas, com os
# encaixes de inset de cada uma. Escrever isso à mão é escrever duas barras.
#
# ⚠️ O que ele NÃO resolve, e o comentário aqui já afirmou que resolvia: **qual**
# forma usar. O padrão dele escolhe barra inferior quando a altura é compacta —
# ou seja, no celular deitado — e o screenshot mostrou o resultado: 21% da tela
# em paisagem, com zero fileiras da grade visíveis. O `AppOdeon` passa um
# `layoutType` explícito por causa disso, e o número está lá.
#
# Sem versão de propósito: quem alinha é o BOM, como todo `compose-*` acima.
androidx-compose-material3-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }

# Ver o comentário de `media3` acima antes de usar qualquer uma destas.
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }

# O que faz o player usar **a mesma** instância de OkHttp do Retrofit e do Coil.
# Ver a decisão 1 da fase 1 no README: um cliente só, um pool, um lugar onde o
# `Authorization` é posto.
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

# HLS é o que o servidor serve quando o plano não é `direct_play` — segmentos de
# 4s com keyframes alinhados. Sem este artefato o player recebe a playlist e não
# sabe o que fazer com ela.
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }

# A superfície de vídeo — `PlayerView`, que é View e não composable.
#
# Ela NÃO é o mesmo artefato que o `-ui-compose` acima: aquele traz os
# observadores de estado pra escrever controle em Compose; este traz a superfície
# em si. Quem desenha pixel de vídeo é um `SurfaceView` do sistema, e disso
# Compose não tem equivalente — daí o `AndroidView` em `TelaDoPlayer`.
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-cast = { group = "androidx.media3", name = "media3-cast", version.ref = "media3" }

# O SDK do Cast do Google, que o `media3-cast` usa por baixo.
#
# Ele **não** vem junto com o Media3 e precisa ser declarado: o `CastPlayer` do
# Media3 é a ponte, e o `CastContext` que ele recebe vem daqui. Sem esta linha o
# build passa e o app quebra em tempo de execução, na primeira vez que alguém
# tocar no botão de Cast.
play-services-cast-framework = { group = "com.google.android.gms", name = "play-services-cast-framework", version.ref = "playServicesCast" }

glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# O `kotlin` acima é 2.4.10 e **não** é palpite: é o que o AGP 9.3.1 embute,
# medido em `:app:dependencies` (`org.jetbrains.kotlin:kotlin-stdlib:2.4.10`).
# Plugin de compilador em versão diferente da do compilador não carrega.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# NÃO existe aqui um `kotlin-android`.
#
# O AGP 9 traz Kotlin embutido e **reprova** quem aplica o plugin antigo:
#
#     The 'org.jetbrains.kotlin.android' plugin is no longer required for
#     Kotlin support since AGP 9.0.
#
# É a diferença mais visível entre este catálogo e o do `clients/`, que está em
# AGP 8.7 e precisa dele.
