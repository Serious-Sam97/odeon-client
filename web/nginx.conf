# R43 — o preço do `BrowserRouter`.
#
# Com endereço de verdade (`/p/rudney`, `/biblioteca`), o primeiro GET de um
# link compartilhado vai para um caminho que **não é arquivo**. O nginx padrão
# responde 404 e a página nem chega a carregar — o router mora no navegador, e
# o navegador nunca recebeu o navegador.
#
# `try_files` resolve: se não existe arquivo com esse nome, devolve o
# `index.html` e deixa o router decidir. É a única linha de servidor que a
# fase inteira precisou.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # O que é build tem hash no nome e não muda: cache longo. O `index.html`
    # não pode ter cache, senão um deploy novo continua servindo o antigo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
